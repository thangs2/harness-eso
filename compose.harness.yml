# Observe plane — một container mỗi project, host port = port trong `~/.harness/workspace.json`
# (x79 :8792, baplatform :8793, fineso :8794, …). Container luôn bind :8790 bên trong, và con số đó
# cố ý khác base của host port: hai thứ trả lời hai câu hỏi khác nhau ("project này sở hữu cửa vào
# nào" vs "process lắng nghe ở đâu"), nên dùng chung một số làm `docker ps` trông như mọi stack đều
# ở 8792. Hằng số ở `packages/harness-foundation/src/observe-port.mjs` (`OBSERVE_CONTAINER_PORT`).
# Stack identity là project id (`-p harness-observatory-<id>`), KHÔNG phải port — xem
# `packages/harness-foundation/src/observe-port.mjs`.
services:
    observe-server:
        build:
            context: .
            dockerfile: observatory.Dockerfile
        image: mu/harness-observe:local
        ports:
            - "${HARNESS_OBSERVE_PORT:-8792}:${HARNESS_OBSERVE_CONTAINER_PORT:-8790}"
        environment:
            HARNESS_SERVER_HOST: "0.0.0.0"
            # SQLite + writable observe state (not on consumer bind mount)
            HARNESS_DATA_ROOT: /data/observe
            HARNESS_PRODUCT_STATE_DIR: /data/product-state
            HARNESS_PROFILES_DIR: /app/profiles
            HARNESS_AGENT_ROOT_HOST: ${HARNESS_AGENT_ROOT:?Set HARNESS_AGENT_ROOT (e.g. $HOME/Workspaces)}
            HARNESS_AGENT_MOUNT: /agent-repos
            HARNESS_CURSOR_MOUNT: /host-cursor
            HARNESS_GEMINI_MOUNT: /host-gemini
            HARNESS_CLAUDE_MOUNT: /host-claude-projects
            HARNESS_DSH_MOUNT: /host-dsh
            HARNESS_REPO_ROOT_HOST: ${HARNESS_REPO_ROOT:?Set HARNESS_REPO_ROOT}
            # Poll interval for the ingest worker. It existed in `observe-config.mjs` from the start but
            # was never listed here, so `composeEnv()`'s `{...process.env}` was dropped by compose and
            # every container ran the 2000 ms fallback: 4 stacks each re-scanning the transcript and
            # DSH spines every 2 s. On a macOS bind mount each `readdir` is a virtiofs round-trip, so
            # idle cost was ~380% CPU across 4 containers (measured 2026-10-23, `docker stats`).
            #
            # 10 s is the default because ingest is a background job and the UI already refreshes over
            # SSE on a real change — a slower poll costs nothing a human can perceive. Override per
            # operator with `HARNESS_INGEST_POLL_MS=<ms>` in the shell that runs `deploy.sh`; 500 ms is
            # the floor enforced in `startIngestLoop`.
            HARNESS_INGEST_POLL_MS: ${HARNESS_INGEST_POLL_MS:-10000}
        volumes:
            # Consumer repo — read-only. This is the only path that identifies a project.
            - ${HARNESS_REPO_ROOT:?Set HARNESS_REPO_ROOT}:/data/repo:ro
            - observe-data:/data/observe
            # Product state lives in the operator's home, NOT in the harness-eso checkout. Mounting
            # the checkout here is what made the running stack depend on where the source tree is:
            # `git clean` or moving it took the project registry with it, and a container started
            # from a deleted directory could not boot at all.
            #
            # This mount also carries the MCP usage ledger (`<dir>/deepseek-usage.jsonl`), which is
            # how the host-side DeepSeek MCP server and this container agree on one file: both
            # resolve it through product state, so neither needs to know the other's layout. Do not
            # move the ledger under HARNESS_DATA_ROOT — that root is a *named volume* here, a
            # container-only filesystem the host server cannot see.
            - ${HARNESS_PRODUCT_STATE_HOST:-${HOME}/.harness}:/data/product-state
            - ${HARNESS_AGENT_ROOT}:/agent-repos
            # Agent transcripts (REQUEST spine) — read-only; see documents/04.operations/02.docker-deploy.md
            - ${HARNESS_CURSOR_HOME:-${HOME}/.cursor}:/host-cursor:ro
            - ${HARNESS_GEMINI_HOME:-${HOME}/.gemini}:/host-gemini:ro
            - ${HARNESS_CLAUDE_HOME:-${HOME}/.claude/projects}:/host-claude-projects:ro
            # DSH sessions (the host that runs the harness-eso plugin) — read-only.
            # `~/.harness` is already mounted at /data/product-state; the gate trail lives there.
            - ${HARNESS_DSH_HOME:-${HOME}/.dsh}:/host-dsh:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "const r=await fetch('http://127.0.0.1:8790/health');if(!r.ok)process.exit(1)",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
        restart: unless-stopped

volumes:
    observe-data:
